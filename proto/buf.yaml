# The protobuf definitions under this directory are the source of truth for
# every API surface: the agent gRPC protocol and the REST/JSON façade generated
# from it (ADR-0007). This file is the module root so that package innerwall.v1
# lives at innerwall/v1/ and files import as innerwall/v1/<name>.proto.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
