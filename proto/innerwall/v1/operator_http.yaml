# HTTP bindings of the operator surface (ADR-0021). The façade is generated
# from innerwall/v1/operator.proto together with this file (ADR-0007): a
# binding is declared here, beside the service it binds, so the protobuf
# module carries no dependency on an external schema registry, and every
# route the listener serves is visible in one reviewable place. A service
# with no binding here has no REST route.
#
# Responses whose message wraps a single object unwrap it (response_body),
# so POST /api/v1/session and GET /api/v1/me both answer with the Me
# object itself.
type: google.api.Service
config_version: 3

http:
  rules:
    - selector: innerwall.v1.OperatorService.CreateSession
      post: /api/v1/session
      body: "*"
      response_body: me
    - selector: innerwall.v1.OperatorService.DeleteSession
      delete: /api/v1/session
    - selector: innerwall.v1.OperatorService.GetMe
      get: /api/v1/me
      response_body: me
