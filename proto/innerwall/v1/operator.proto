syntax = "proto3";

package innerwall.v1;

option go_package = "github.com/innerwall-dev/innerwall/internal/gen/innerwall/v1;innerwallv1";

// The operator-facing surface (ADR-0021): the session and identity
// endpoints of the REST/JSON façade. The façade is generated from this
// service and the HTTP bindings in operator_http.yaml beside it (ADR-0007).
//
// Authentication is a concern of the listener, not of these messages: a
// request carries a session cookie or a bearer operator token, the
// middleware resolves either to the one operator principal, and a handler
// never learns which form was presented. Authorization is binary; there is
// no role or permission field here and none is reserved.

import "google/protobuf/wrappers.proto";

service OperatorService {
  // Exchange the operator password for a session. On success the response
  // sets the session cookie and carries the operator's identity. A control
  // plane on which no password has been set refuses with a distinct
  // problem type; there is no endpoint that sets the first password.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Revoke the current session and clear the cookie.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // The authenticated operator's identity and the site label.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

// Me is the operator as the console sees it.
message Me {
  // Display name set with the password; absent until one is set, in
  // which case the console renders a generic fallback.
  google.protobuf.StringValue display_name = 1;
  // The site label configured on the control plane, shown in the console
  // header. Empty when none is configured.
  string site = 2;
}

message CreateSessionRequest {
  string password = 1;
}

message CreateSessionResponse {
  Me me = 1;
}

message DeleteSessionRequest {}

message DeleteSessionResponse {}

message GetMeRequest {}

message GetMeResponse {
  Me me = 1;
}
