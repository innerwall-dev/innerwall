<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>Innerwall</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- The theme is resolved before first paint so a stored preference
		     never flashes the other theme: a stored choice wins, the system
		     preference is the default, and a store that refuses to be read
		     still leaves the system preference. It sets data-theme (which the
		     tokens key on), the .dark class that mirrors it, and the page's
		     color scheme, which the browser paints the canvas in before the
		     stylesheet arrives. ThemeProvider resolves the same way. The
		     console makes no external request; this is the only inline script
		     it carries. -->
		<script>
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem("innerwall.console.theme");
				} catch (_) {}
				const theme =
					stored === "dark" || stored === "light"
						? stored
						: matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
				const root = document.documentElement;
				root.dataset.theme = theme;
				root.classList.toggle("dark", theme === "dark");
				const scheme = document.querySelector('meta[name="color-scheme"]');
				if (scheme) scheme.content = theme;
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
