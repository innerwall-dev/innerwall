<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<title>Innerwall</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- The theme class is applied before first paint so a stored
		     preference never flashes the other theme. The console makes no
		     external request; this is the only inline script it carries. -->
		<script>
			(() => {
				try {
					const stored = localStorage.getItem("innerwall.console.theme");
					const dark =
						stored === "dark" ||
						(stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
					if (dark) document.documentElement.classList.add("dark");
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
