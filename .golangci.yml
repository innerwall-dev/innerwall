# golangci-lint configuration. This file is the ruleset; style is not debated
# in PRs. Generated code (internal/gen, internal/store/db) is excluded because
# it is regenerated by CI and must never be hand-edited.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - internal/gen
      - internal/store/db

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/innerwall-dev/innerwall
  exclusions:
    paths:
      - internal/gen
      - internal/store/db
