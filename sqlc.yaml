# sqlc compiles the hand-written SQL in internal/store/queries into type-safe
# Go against the schema built from internal/store/migrations (ADR-0006).
# Regenerate with `make sqlc`; CI fails on drift.
version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
