# Coding-agent workflows (ADR-0014):
#   claude      — interactive: responds to @claude mentions on issues and PRs.
#   adr-review  — automation: reviews a PR's changes against the Accepted
#                 ADRs in docs/adr/ and posts findings as a PR comment. It
#                 runs on every PR that is ready for review (a draft is
#                 reviewed when it is marked ready), except one whose every
#                 changed file is generated output or a lockfile, and
#                 only when the triggering actor holds write access; any
#                 other author's PR gets a "did not post" job-summary note
#                 and is reviewed by an @claude mention instead. The
#                 review is anchored to the diff; it re-reads the whole ADR
#                 record only when the record itself (docs/adr/, CLAUDE.md)
#                 changes. Advisory only; findings never fail the build,
#                 but a review that was attempted and errored on a branch's
#                 pull request fails the job, so a review that never ran is
#                 never mistaken for one that found nothing.
#                 It runs on pull_request_target so a fork's pull request
#                 gets the same token and OIDC identity as a branch's; the
#                 checkout is the base ref, the source of truth, and nothing
#                 from the pull request's head is checked out or executed.
#
# Both jobs authenticate to the API through workload identity federation using
# the job's OIDC token. No static credential is configured anywhere in this
# workflow: a static key or token would silently take precedence over
# federation. The federation identifiers below are not secrets; only the OIDC
# token is. On GitHub, adr-review acts with the job's own short-lived
# GITHUB_TOKEN rather than exchanging its OIDC token for an app token: the
# exchange rejects tokens minted for pull_request_target
# (anthropics/claude-code-action#1886), so the review posts as
# github-actions[bot].
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only adr-review runs on this event. A pull request whose every changed
    # file is generated output or a lockfile carries no decision to review, so
    # it does not trigger the run. Any other changed file alongside these still
    # triggers it. adr-review is advisory, not a required check, so a skipped
    # run never blocks a merge.
    paths-ignore:
      - "internal/gen/**"
      - "internal/store/db/**"
      - "go.sum"
      - "ui/package-lock.json"

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_017Z5x46M1Apn3aGGLYLFfsT
          anthropic_organization_id: 2d941f98-8c11-4723-86e9-8dddac458911
          anthropic_service_account_id: svac_01LUZUMbvB9sTx4tXUQ1oHm2
          anthropic_workspace_id: wrkspc_01UvMt6iYb2SMsdhT2XRoFz2
          claude_args: |
            --allowedTools "Bash(make build),Bash(make test),Bash(make lint),Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(npm --prefix ui run:*)"

  adr-review:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A new push makes the in-flight review stale; cancel it rather than pay
    # for both. Keyed per pull request and scoped to this job only.
    concurrency:
      group: adr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      # The base ref, never the pull request's head: the review reads the
      # diff through `gh pr diff` and the record from the base.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - id: review
        uses: anthropics/claude-code-action@v1
        # Advisory: a finding is a review comment, not a failed check.
        continue-on-error: true
        with:
          allowed_bots: "claude,claude[bot]"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_federation_rule_id: fdrl_017Z5x46M1Apn3aGGLYLFfsT
          anthropic_organization_id: 2d941f98-8c11-4723-86e9-8dddac458911
          anthropic_service_account_id: svac_01LUZUMbvB9sTx4tXUQ1oHm2
          anthropic_workspace_id: wrkspc_01UvMt6iYb2SMsdhT2XRoFz2
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} for conformance with the project's architecture decision records.

            The ADRs in docs/adr/ are the source of truth for this project. An Accepted ADR's core decision is immutable; a change that contradicts one is allowed only when the same pull request adds a superseding ADR (next number, a `Supersedes: ADR-XXXX` header, and the old ADR marked Superseded). Everything else is an in-place amendment recorded under an `## Amendments` heading, as docs/adr/README.md defines. CLAUDE.md distills the ADRs into hard rules and vocabulary rules; ARCHITECTURE.md describes the system they produce.

            Steps:
            1. Read docs/adr/README.md and CLAUDE.md.
            2. Read the pull request diff with `gh pr diff ${{ github.event.pull_request.number }}` and the description with `gh pr view ${{ github.event.pull_request.number }}`.
            3. Choose the review mode from the files the diff touches:
               - Full-corpus audit, only when the diff touches anything under docs/adr/ (docs/adr/README.md included) or CLAUDE.md: read every ADR in docs/adr/ and check the whole record, not just the diff: every ADR states its current decision, status lines and `Supersedes:` headers agree with each other, amendment notes follow the convention in docs/adr/README.md, and CLAUDE.md's hard rules still match the ADRs they cite.
               - Diff-anchored review, the default for every other pull request: review the changes only. Read the ADRs the change bears on (CLAUDE.md's hard rules cite them by number; the titles are the file names in docs/adr/) and any document the diff modifies or references. Do not re-read or re-audit documents the pull request does not change.
            4. For each change, decide whether it contradicts an Accepted ADR. Contradictions include, but are not limited to: an ORM or query builder or runtime SQL generation; polling loops in steady state; firewall changes outside the owned nftables table or non-atomic rule application; an agent that fails open or closed rather than static; agent self-update code; per-connection flow shipping; flow access that bypasses the FlowStore interface; UI code that reaches anything other than the public REST façade; an operator REST handler that holds domain logic of its own instead of calling the shared domain layer the command line calls (the operator surface is hand-shaped HTTP by ADR-0007 as amended and ADR-0021; protobuf is the source of truth for the agent contract only); outbound policy compilation in v1; mutable attributes in certificates; control-plane state that matters beyond a single process; rendered policy that transits anything other than the mutually authenticated sync stream without an authenticity envelope (signing is deferred until then by ADR-0012 as amended), or removal of region_id; Makefile targets with logic; a comparison to a competing product, or an origin-story reference, anywhere in the repository (the implementation stack may be named); a hand-edited generated file; an edit to an Accepted ADR's core decision, or an amendment that does not follow the in-place amendment convention in docs/adr/README.md.
            5. In either mode, also report a document the change leaves inconsistent with the record it belongs to, and a dangling reference the change introduces (an ADR number, file, or heading that does not exist).
            6. If a contradiction is present, check whether the pull request adds a superseding ADR that covers it.

            Post exactly one comment on the pull request, and keep it one across runs: update your earlier comment rather than adding another.
            - The comment's first line is the marker `<!-- innerwall-adr-review -->`, exactly, on every post and every update.
            - Find your prior comment by that marker: `gh api --paginate repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- innerwall-adr-review -->"))) | .id'`.
            - If that prints an id, update that comment with `gh api --method PATCH repos/${{ github.repository }}/issues/comments/<id> -f body=<comment>`, quoting the body for the shell (the first id, if it prints more than one). If it prints nothing, create the comment with `gh api --method POST repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -f body=<comment>`, quoted the same way.
            Structure it as:
            - A one-line verdict, naming the mode used: "No ADR contradictions found" or "ADR review: N finding(s)".
            - For each finding: the ADR number and title, the file and line, what the change does, why it contradicts the ADR, and whether a superseding ADR is present. Quote the ADR text you are relying on.
            - If a superseding ADR is present, note whether it follows the format in docs/adr/README.md.

            Stay within the ADRs: do not review style, naming, or test coverage. Do not modify files. This review is advisory; it informs the human reviewers and does not block the merge.
          # The action's own `model` input is deprecated in favor of `--model`.
          # The turn cap is a backstop against wandering the corpus, not a
          # budget: even a full-corpus audit that reads one document per turn
          # fits well inside it.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Read,Glob,Grep"
            --max-turns 40
      # continue-on-error lets the job decide what a failed review means.
      # On a branch's pull request the review had every credential it needs,
      # so a failure is a broken review: name it and fail the job. On a
      # fork's pull request a failure is the expected refusal of an author
      # without write access (ADR-0014), so the check stays green and the
      # summary says no review posted.
      - if: steps.review.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        run: |
          echo "### ADR review failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The review step failed on a pull request from this repository, so no ADR review comment was posted. That is a broken review, not a refused one: the job log above has the cause." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - if: steps.review.outcome == 'failure' && github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
        run: |
          echo "### ADR review did not post" >> "$GITHUB_STEP_SUMMARY"
          echo "The review step failed on a pull request from a fork, so no ADR review comment was posted on this pull request. The job log above has the cause." >> "$GITHUB_STEP_SUMMARY"
