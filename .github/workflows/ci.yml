# Continuous integration: build, test, lint (Go, UI), proto (lint, build,
# breaking-change gate), generated-code drift, and DCO sign-off. Tool versions here are
# mirrored in scripts/install-tools.sh so local regeneration matches CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  BUF_VERSION: "1.72.0"
  SQLC_VERSION: "1.31.1"
  GOLANGCI_LINT_VERSION: "v2.5.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build

  test:
    runs-on: ubuntu-latest
    # Integration tests (enrollment end to end, the store) run against a
    # disposable Postgres and skip when INNERWALL_TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: innerwall_test
          POSTGRES_USER: innerwall
          POSTGRES_PASSWORD: innerwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innerwall -d innerwall_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
        env:
          INNERWALL_TEST_DATABASE_URL: postgres://innerwall:innerwall@127.0.0.1:5432/innerwall_test?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run lint

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui

  drift:
    name: generated-code drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - run: scripts/check-drift.sh

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - run: buf lint
      - run: buf build
      # Breaking changes are compared against main. A breaking change passes
      # only when the PR title or body references an ADR (ADR-0007).
      - run: scripts/check-proto-breaking.sh origin/main
        env:
          PR_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-dco.sh "origin/${{ github.base_ref }}..HEAD"
