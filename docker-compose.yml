# The supported v1 deployment: one control-plane binary and one Postgres
# (ADR-0005). All durable state lives in Postgres; the control plane is
# stateless and can be replaced or scaled to N replicas behind a load balancer.
#
# Until milestone M2 wires the services in, the control-plane container starts,
# prints its version, and exits; Postgres stays up for migration work.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: innerwall
      POSTGRES_USER: innerwall
      POSTGRES_PASSWORD: innerwall
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerwall -d innerwall"]
      interval: 5s
      timeout: 3s
      retries: 10

  innerwall:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres connection string for the control plane.
      INNERWALL_DATABASE_URL: postgres://innerwall:innerwall@postgres:5432/innerwall?sslmode=disable
    ports:
      # REST/JSON façade and embedded UI.
      - "127.0.0.1:8080:8080"
      # Agent gateway (gRPC over mTLS).
      - "8443:8443"

volumes:
  pgdata:
