# The supported v1 deployment: one control-plane binary and one Postgres
# (ADR-0017). All durable state lives in Postgres; the control plane is
# stateless and can be replaced or scaled to N replicas behind a load balancer.
# The one exception is the signing authority's key, which is operator
# configuration: here it lives in the innerwall-state volume, and every
# replica of this stack would mount the same one.
#
# The control plane applies migrations, creates its signing authority and a
# self-signed operator certificate on first start (both persisted in the
# innerwall-state volume; the certificate's fingerprint is logged), and
# serves the agent gateway and the operator surface. Set the operator
# password once with `docker compose exec innerwall /innerwall operator
# set-password`. The console is served on the operator surface.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: innerwall
      POSTGRES_USER: innerwall
      POSTGRES_PASSWORD: innerwall
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerwall -d innerwall"]
      interval: 5s
      timeout: 3s
      retries: 10

  innerwall:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "--migrate", "--init-ca", "--tls-hosts", "localhost,127.0.0.1,innerwall"]
    environment:
      # Postgres connection string for the control plane.
      INNERWALL_DATABASE_URL: postgres://innerwall:innerwall@postgres:5432/innerwall?sslmode=disable
      INNERWALL_CA_DIR: /var/lib/innerwall/ca
      # The host:port agents reach the agent gateway at, as the console's
      # enroll command prints it. The gateway is published on the host's
      # port 8443 below, and the control plane's certificate names
      # localhost, so an agent on the same host enrolls against this.
      INNERWALL_GATEWAY_ADVERTISE_ADDRESS: localhost:8443
    volumes:
      - innerwall-state:/var/lib/innerwall
    ports:
      # Operator surface: REST/JSON façade and console, TLS only.
      - "127.0.0.1:8080:8080"
      # Agent gateway (gRPC over mTLS).
      - "8443:8443"

volumes:
  pgdata:
  innerwall-state:
