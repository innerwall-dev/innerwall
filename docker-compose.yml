# The supported v1 deployment: one control-plane binary and one Postgres
# (ADR-0019). All durable state lives in Postgres; the control plane is
# stateless and can be replaced or scaled to N replicas behind a load balancer.
# The one exception is the signing authority's key, which is operator
# configuration: here it lives in the innerwall-state volume, and every
# replica of this stack would mount the same one.
#
# The control plane applies migrations, creates its signing authority on
# first start (persisted in the innerwall-state volume), and serves the agent
# gateway. The REST/JSON façade and UI are wired in by later milestones.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: innerwall
      POSTGRES_USER: innerwall
      POSTGRES_PASSWORD: innerwall
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerwall -d innerwall"]
      interval: 5s
      timeout: 3s
      retries: 10

  innerwall:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "--migrate", "--init-ca", "--tls-hosts", "localhost,127.0.0.1,innerwall"]
    environment:
      # Postgres connection string for the control plane.
      INNERWALL_DATABASE_URL: postgres://innerwall:innerwall@postgres:5432/innerwall?sslmode=disable
      INNERWALL_CA_DIR: /var/lib/innerwall/ca
    volumes:
      - innerwall-state:/var/lib/innerwall
    ports:
      # REST/JSON façade and embedded UI.
      - "127.0.0.1:8080:8080"
      # Agent gateway (gRPC over mTLS).
      - "8443:8443"

volumes:
  pgdata:
  innerwall-state:
